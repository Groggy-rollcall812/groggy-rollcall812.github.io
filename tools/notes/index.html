<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>随手记</title>
<meta name="theme-color" content="#EFEAE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">

<link rel="stylesheet" href="../../theme.css">
<style>
  header { margin-bottom:38px; }
  .head-top { display:flex; align-items:center; gap:14px; margin-bottom:24px; }
  .head-top .overline { color:var(--text-sec); }

  .composer { display:flex; gap:10px; }
  .composer .field { flex:1; }
  .composer .btn { padding:0 22px; white-space:nowrap; }

  .hint {
    margin:12px 0 34px;
    font-family:var(--mono);
    font-size:11px; letter-spacing:.8px;
    color:var(--text-sec);
  }

  /* 列表：靠分隔线区隔，不用卡片，保持编辑感 */
  ul { list-style:none; }
  li {
    display:flex; align-items:flex-start; gap:16px;
    padding:18px 2px;
    border-bottom:1px solid var(--line-soft);
  }
  li:first-child { border-top:1px solid var(--line-soft); }
  li.done .text { color:var(--text-sec); text-decoration:line-through; }

  .check {
    flex-shrink:0; width:22px; height:22px; margin-top:2px;
    background:var(--cream-deep);
    border-radius:6px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:13px; color:transparent;
    transition:background .15s;
  }
  .check:hover { background:#DCD5C5; }
  li.done .check { background:var(--orange); color:#fff; }

  .text {
    flex:1; font-size:17px; line-height:1.55;
    word-break:break-word;
  }

  .del {
    flex-shrink:0; background:none; border:none; cursor:pointer;
    font-family:var(--mono); font-size:16px;
    color:var(--text-sec); opacity:.5;
    padding:0 2px; line-height:1.5;
    transition:opacity .15s, color .15s;
  }
  .del:hover { opacity:1; color:var(--orange); }

  .empty {
    background:var(--cream-deep);
    border-radius:var(--radius-lg);
    padding:56px 30px; text-align:center;
    color:var(--text-sec); font-size:15px; line-height:1.8;
  }

  .bar {
    display:flex; justify-content:space-between; align-items:center;
    margin-top:26px;
    font-family:var(--mono); font-size:11px; letter-spacing:1.2px;
    color:var(--text-sec);
  }
  .linkbtn {
    background:none; border:none; cursor:pointer;
    font-family:var(--mono); font-size:11px; letter-spacing:1.2px;
    color:var(--text-sec);
    transition:color .15s;
  }
  .linkbtn:hover { color:var(--orange); }

  /* 备份区：跟主体拉开距离，日常不干扰 */
  .backup {
    margin-top:48px; padding-top:22px;
    border-top:1px solid var(--line-soft);
  }
  .backup-head {
    display:flex; align-items:baseline; gap:10px;
    margin-bottom:12px;
  }
  .backup-row { display:flex; gap:10px; flex-wrap:wrap; }
  .backup-note {
    margin-top:12px;
    font-size:13px; line-height:1.65; color:var(--text-sec);
  }

  /* 次要按钮：描边而非实心，不跟主操作抢 */
  .btn-ghost {
    font-family:var(--serif);
    font-weight:900; font-size:14px;
    color:var(--text);
    background:transparent;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:10px 18px; cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .btn-ghost:hover { border-color:var(--orange); color:var(--orange); }

  @media (max-width:480px) {
    .wrap { padding-left:22px; padding-right:22px; }
    .title-display { font-size:34px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="head-top">
      <a class="back" href="../../" aria-label="返回工作台">←</a>
      <div class="overline">Notes</div>
    </div>
    <h1 class="title-display">随手<span class="orange">记</span></h1>
  </header>

  <form class="composer" id="form">
    <input type="text" class="field" id="input" placeholder="想到什么，记一笔" autocomplete="off">
    <button class="btn" type="submit">记下</button>
  </form>
  <div class="hint">只存在这台设备的浏览器里，不会上传</div>

  <ul id="list"></ul>
  <div class="empty" id="empty">还没有内容<br>在上面记第一笔</div>

  <div class="bar">
    <span id="count"></span>
    <button class="linkbtn" id="clear" type="button">清除已完成</button>
  </div>

  <section class="backup">
    <div class="backup-head">
      <span class="card-mini-icon" style="font-size:17px">⇄</span>
      <span class="overline sec">Backup</span>
    </div>
    <div class="backup-row">
      <button class="btn-ghost" id="export" type="button">导出备份</button>
      <button class="btn-ghost" id="import" type="button">导入备份</button>
    </div>
    <p class="backup-note">
      清除浏览器数据、删掉这个应用、或者换手机，本地数据都会丢。
      建议定期导出一份存到网盘或发给自己，换设备时导入即可恢复。
    </p>
  </section>

</div>

<script src="../../storage.js"></script>
<script>
  const store   = new Store('notes');
  const listEl  = document.getElementById('list');
  const emptyEl = document.getElementById('empty');
  const countEl = document.getElementById('count');
  const input   = document.getElementById('input');

  // 只接受数组，防止导入了结构不对的数据后页面崩掉
  const asList = v => Array.isArray(v) ? v : [];

  let items = asList(store.load([]));

  function render() {
    listEl.innerHTML = '';
    emptyEl.style.display = items.length ? 'none' : 'block';

    items.forEach((it, i) => {
      const li = document.createElement('li');
      if (it.done) li.className = 'done';

      const check = document.createElement('div');
      check.className = 'check';
      check.textContent = '✓';
      check.onclick = () => {
        items[i].done = !items[i].done;
        store.save(items); render();
      };

      const text = document.createElement('div');
      text.className = 'text';
      text.textContent = it.text;   // 不用 innerHTML，避免输入内容被当标签解析

      const del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.textContent = '×';
      del.onclick = () => {
        items.splice(i, 1);
        store.save(items); render();
      };

      li.append(check, text, del);
      listEl.appendChild(li);
    });

    const left = items.filter(i => !i.done).length;
    const pad = n => String(n).padStart(2, '0');
    countEl.textContent = items.length
      ? `${pad(left)} 待办 / ${pad(items.length)} 共计`
      : '';
  }

  document.getElementById('form').onsubmit = e => {
    e.preventDefault();
    const v = input.value.trim();
    if (!v) return;
    items.unshift({ text: v, done: false, at: Date.now() });
    input.value = '';
    store.save(items); render();
  };

  document.getElementById('clear').onclick = () => {
    items = items.filter(i => !i.done);
    store.save(items); render();
  };

  document.getElementById('export').onclick = () => store.exportFile();

  document.getElementById('import').onclick = () => {
    store.importFile(data => {
      const incoming = asList(data);
      if (!incoming.length) {
        alert('备份里没有可导入的内容');
        return;
      }

      // 已有数据时让用户选，避免误覆盖
      let next;
      if (items.length) {
        const merge = confirm(
          `备份里有 ${incoming.length} 条，当前有 ${items.length} 条。\n\n` +
          '确定 = 合并（保留现有，去重后追加）\n取消 = 用备份完全替换'
        );
        if (merge) {
          const seen = new Set(items.map(i => i.text + '|' + (i.at || '')));
          const add = incoming.filter(i => !seen.has(i.text + '|' + (i.at || '')));
          next = items.concat(add);
          alert(`已合并，新增 ${add.length} 条`);
        } else {
          next = incoming;
          alert(`已替换为备份内容，共 ${incoming.length} 条`);
        }
      } else {
        next = incoming;
        alert(`已恢复 ${incoming.length} 条`);
      }

      items = next;
      store.save(items); render();
    });
  };

  render();
</script>
</body>
</html>
