<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>收藏夹</title>
<meta name="theme-color" content="#EFEAE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">

<!-- 封面都存成本地图片，页面不往外发请求，顺手不带 referer -->
<meta name="referrer" content="no-referrer">

<link rel="stylesheet" href="../../theme.css">
<style>
  header { margin-bottom:28px; }
  .head-top { display:flex; align-items:center; gap:14px; margin-bottom:24px; }
  .head-top .overline { color:var(--text-sec); }

  /* === 视图切换：下划线式，不用胶囊按钮 === */
  .tabs {
    display:flex; gap:26px;
    border-bottom:1px solid var(--line);
    margin-bottom:26px;
  }
  .tab {
    background:none; border:none; cursor:pointer;
    font-family:var(--serif); font-weight:900; font-size:17px;
    color:var(--text-sec);
    padding:0 0 12px; margin-bottom:-1px;
    border-bottom:2px solid transparent;
    transition:color .15s, border-color .15s;
  }
  .tab.on { color:var(--text); border-bottom-color:var(--orange); }

  .view { display:none; }
  .view.on { display:block; }

  /* === 分类筛选 === */
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
  .chip {
    background:var(--cream-deep); border:1px solid transparent;
    border-radius:var(--radius);
    font-family:var(--mono); font-size:12px; letter-spacing:.5px;
    color:var(--text-sec);
    padding:8px 13px; cursor:pointer;
    transition:background .15s, color .15s;
  }
  .chip.on { background:var(--orange); color:#fff; }
  .chip.ghost { background:transparent; border-color:var(--line); }
  .chip.ghost:hover { border-color:var(--orange); color:var(--orange); }

  /* === 条目列表 === */
  ul.items { list-style:none; }
  ul.items li {
    display:flex; gap:15px; align-items:flex-start;
    padding:18px 2px;
    border-bottom:1px solid var(--line-soft);
  }
  ul.items li:first-child { border-top:1px solid var(--line-soft); }

  /* 封面：没有图就是排版封面，一样立得住 */
  .cover {
    flex-shrink:0; width:52px; height:74px;
    border-radius:8px; overflow:hidden;
    background:var(--cream-deep);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .cover .ch {
    font-family:var(--serif); font-weight:900; font-size:24px;
    color:var(--ink); letter-spacing:-1px;
  }

  .it-main { flex:1; min-width:0; }
  .it-title {
    font-size:17px; font-weight:900; line-height:1.45;
    word-break:break-word;
  }
  .it-meta {
    margin-top:5px;
    font-family:var(--mono); font-size:11px; letter-spacing:.6px;
    color:var(--text-sec);
  }
  .it-meta .dot { opacity:.5; margin:0 6px; }
  .it-note {
    margin-top:8px; font-size:14px; line-height:1.6;
    color:var(--text-sec); word-break:break-word;
  }
  .stars { font-family:var(--mono); color:var(--orange); letter-spacing:1px; }

  .it-acts { flex-shrink:0; display:flex; flex-direction:column; gap:6px; }
  .iconbtn {
    background:none; border:none; cursor:pointer;
    font-family:var(--mono); font-size:14px;
    color:var(--text-sec); opacity:.55;
    padding:2px 3px; line-height:1;
    transition:opacity .15s, color .15s;
  }
  .iconbtn:hover { opacity:1; color:var(--orange); }

  .empty {
    background:var(--cream-deep); border-radius:var(--radius-lg);
    padding:52px 30px; text-align:center;
    color:var(--text-sec); font-size:15px; line-height:1.8;
  }

  /* === 日历 === */
  .cal-head {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  .cal-title { font-family:var(--serif); font-weight:900; font-size:22px; letter-spacing:-.5px; }
  .cal-nav { display:flex; gap:8px; }
  .navbtn {
    width:34px; height:34px; flex-shrink:0;
    background:var(--cream-deep); border:none; border-radius:10px;
    color:var(--text-sec); font-family:var(--mono); font-size:15px;
    cursor:pointer; transition:background .15s, color .15s;
  }
  .navbtn:hover { background:var(--orange); color:#fff; }

  .dow {
    display:grid; grid-template-columns:repeat(7,1fr); gap:4px;
    margin-bottom:6px;
  }
  .dow span {
    text-align:center;
    font-family:var(--mono); font-size:10px; letter-spacing:1px;
    color:var(--text-sec);
  }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cell {
    min-height:64px; padding:6px 5px;
    background:var(--cream-deep); border:1.5px solid transparent;
    border-radius:10px; cursor:pointer; overflow:hidden;
    transition:border-color .15s;
    text-align:left;
  }
  .cell.pad { background:transparent; cursor:default; }
  .cell.today .dnum { color:var(--orange); }
  .cell.sel { border-color:var(--orange); }
  .cell.empty0 { cursor:default; }
  .dnum {
    font-family:var(--mono); font-size:11px; color:var(--text-sec);
    display:block; margin-bottom:3px;
  }
  .mini {
    font-family:var(--serif); font-size:9.5px; line-height:1.35;
    color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .dots { display:flex; gap:3px; flex-wrap:wrap; }
  .dots i {
    width:5px; height:5px; border-radius:50%;
    background:var(--orange); display:block;
  }
  .day-panel { margin-top:24px; }
  .day-panel .overline { margin-bottom:12px; display:block; }

  /* 手机上格子太窄，标题换成圆点 */
  @media (max-width:520px) {
    .mini { display:none; }
    .cell { min-height:52px; }
  }
  @media (min-width:521px) { .dots { display:none; } }

  /* === 表单 === */
  .addbar { margin-bottom:22px; }
  .form {
    display:none;
    background:var(--cream-deep);
    border-radius:var(--radius-lg);
    padding:22px 20px; margin-bottom:26px;
  }
  .form.on { display:block; }
  .form .row { margin-bottom:14px; }
  .form label {
    display:block; margin-bottom:7px;
    font-family:var(--mono); font-size:10.5px; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--text-sec);
  }
  .form .field { width:100%; background:var(--cream); }
  .form textarea.field { resize:vertical; min-height:64px; font-family:var(--serif); }
  .inline { display:flex; gap:9px; }
  .inline .field { flex:1; }

  .starpick { display:flex; gap:6px; align-items:center; }
  .starpick button {
    background:none; border:none; cursor:pointer;
    font-family:var(--mono); font-size:20px; line-height:1;
    color:var(--line); padding:0;
    transition:color .12s;
  }
  .starpick button.lit { color:var(--orange); }
  .starpick .clr {
    font-size:10px; letter-spacing:1px; color:var(--text-sec);
    margin-left:6px;
  }

  .cov-row { display:flex; gap:14px; align-items:flex-start; }
  .cov-row .cover { width:58px; height:82px; background:var(--cream); }
  .cov-fields { flex:1; min-width:0; }
  .cov-btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }

  /* 豆瓣候选 */
  .sugg { margin-top:12px; }
  .sugg-list { list-style:none; display:flex; flex-direction:column; gap:2px; }
  .sugg-list li {
    display:flex; gap:11px; align-items:center;
    background:var(--cream); border-radius:10px;
    padding:8px 10px; cursor:pointer;
    transition:background .15s;
  }
  .sugg-list li:hover { background:#E9E2D2; }
  .sugg-list .cover { width:34px; height:48px; background:var(--cream-deep); }
  .sugg-list .cover .ch { font-size:15px; }
  .sugg-t { font-size:14px; font-weight:900; line-height:1.4; }
  .sugg-s { font-family:var(--mono); font-size:10px; letter-spacing:.5px; color:var(--text-sec); margin-top:2px; }
  .sugg-note {
    font-size:12.5px; line-height:1.6; color:var(--text-sec);
    margin-top:10px;
  }

  .form-acts { display:flex; gap:10px; margin-top:20px; }

  .btn-ghost {
    font-family:var(--serif); font-weight:900; font-size:14px;
    color:var(--text); background:transparent;
    border:1.5px solid var(--line); border-radius:var(--radius);
    padding:10px 18px; cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .btn-ghost:hover { border-color:var(--orange); color:var(--orange); }
  .btn-ghost.sm { font-size:12px; padding:7px 13px; }

  .bar {
    display:flex; justify-content:space-between; align-items:center;
    margin-top:24px;
    font-family:var(--mono); font-size:11px; letter-spacing:1.2px;
    color:var(--text-sec);
  }

  /* 备份区 */
  .backup { margin-top:46px; padding-top:22px; border-top:1px solid var(--line-soft); }
  .backup-head { display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
  .backup-row { display:flex; gap:10px; flex-wrap:wrap; }
  .backup-note { margin-top:12px; font-size:13px; line-height:1.65; color:var(--text-sec); }

  @media (max-width:480px) {
    .wrap { padding-left:22px; padding-right:22px; }
    .title-display { font-size:34px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="head-top">
      <a class="back" href="../../" aria-label="返回工作台">←</a>
      <div class="overline">Shelf</div>
    </div>
    <h1 class="title-display">收藏<span class="orange">夹</span></h1>
  </header>

  <div class="tabs">
    <button class="tab on" data-view="list" type="button">清单</button>
    <button class="tab" data-view="cal" type="button">日历</button>
  </div>

  <!-- ============ 清单视图 ============ -->
  <section class="view on" id="v-list">

    <div class="addbar">
      <button class="btn" id="add-open" type="button">＋ 记一条</button>
    </div>

    <!-- 表单：新增和编辑共用 -->
    <div class="form" id="form">
      <div class="row">
        <label for="f-title">标题</label>
        <div class="inline">
          <input type="text" class="field" id="f-title" placeholder="片名 / 书名" autocomplete="off">
          <button class="btn-ghost" id="f-fetch" type="button">找封面</button>
        </div>
        <div class="sugg" id="sugg" style="display:none"></div>
      </div>

      <div class="row">
        <label>分类</label>
        <div class="chips" id="f-cats"></div>
      </div>

      <div class="row inline">
        <div style="flex:1">
          <label for="f-date">日期</label>
          <input type="date" class="field" id="f-date">
        </div>
        <div style="flex:1">
          <label>状态</label>
          <div class="chips" id="f-status"></div>
        </div>
      </div>

      <div class="row">
        <label>评分</label>
        <div class="starpick" id="f-stars">
          <button type="button" data-v="1">●</button>
          <button type="button" data-v="2">●</button>
          <button type="button" data-v="3">●</button>
          <button type="button" data-v="4">●</button>
          <button type="button" data-v="5">●</button>
          <span class="clr"><button class="iconbtn" id="f-star-clr" type="button">清除</button></span>
        </div>
      </div>

      <div class="row">
        <label for="f-note">一句话</label>
        <textarea class="field" id="f-note" placeholder="看完想说的，或者不写"></textarea>
      </div>

      <div class="row">
        <label>封面</label>
        <div class="cov-row">
          <div class="cover" id="f-cov-prev"><span class="ch">—</span></div>
          <div class="cov-fields">
            <input type="text" class="field" id="f-cover" placeholder="粘贴图片链接，或直接上传" autocomplete="off">
            <div class="cov-btns">
              <button class="btn-ghost sm" id="f-upload" type="button">上传图片</button>
              <button class="btn-ghost sm" id="f-douban" type="button">去豆瓣搜</button>
              <button class="btn-ghost sm" id="f-cov-clr" type="button">不用封面</button>
            </div>
          </div>
        </div>
      </div>

      <div class="form-acts">
        <button class="btn" id="f-save" type="button">保存</button>
        <button class="btn-ghost" id="f-cancel" type="button">取消</button>
      </div>
    </div>

    <div class="chips" id="filter"></div>

    <ul class="items" id="list"></ul>
    <div class="empty" id="empty">还没有记录<br>点上面「记一条」开始</div>

    <div class="bar">
      <span id="count"></span>
      <button class="iconbtn" id="mng-cat" type="button" style="font-size:11px;letter-spacing:1.2px;opacity:.7">管理分类</button>
    </div>
  </section>

  <!-- ============ 日历视图 ============ -->
  <section class="view" id="v-cal">
    <div class="cal-head">
      <div class="cal-title" id="cal-title"></div>
      <div class="cal-nav">
        <button class="navbtn" id="cal-prev" type="button">‹</button>
        <button class="navbtn" id="cal-today" type="button" style="width:auto;padding:0 12px;font-size:11px;letter-spacing:1px">今天</button>
        <button class="navbtn" id="cal-next" type="button">›</button>
      </div>
    </div>
    <div class="dow"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="grid" id="grid"></div>

    <div class="day-panel" id="day-panel"></div>
  </section>

  <section class="backup">
    <div class="backup-head">
      <span class="card-mini-icon" style="font-size:17px">⇄</span>
      <span class="overline sec">Backup</span>
    </div>
    <div class="backup-row">
      <button class="btn-ghost" id="export" type="button">导出备份</button>
      <button class="btn-ghost" id="import" type="button">导入备份</button>
    </div>
    <p class="backup-note">
      数据只在这台设备的浏览器里。清除浏览器数据、删掉这个应用、换手机都会丢，
      建议定期导出一份存网盘。封面会压成缩略图一起存进来，导出文件会稍大一点。
    </p>
  </section>

</div>

<script src="../../storage.js"></script>
<script src="./app.js"></script>
</body>
</html>
