<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的工作台</title>

<!-- PWA：加到主屏后按独立应用打开 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EFEAE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="theme.css">
<style>
  /* === 页头：overline + 大标题，关键词换橙色 === */
  header { margin-bottom:52px; }
  .head-top {
    display:flex; align-items:center; gap:18px;
    margin-bottom:30px;
  }
  .head-meta { display:flex; flex-direction:column; gap:7px; }
  .head-date {
    font-family:var(--mono);
    font-size:12px; letter-spacing:1.5px;
    color:var(--text-sec);
  }
  header .title-display { max-width:14em; }

  /* === 工具区 === */
  .section-head {
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:22px;
  }
  .section-count {
    font-family:var(--mono);
    font-size:12px; letter-spacing:1.5px;
    color:var(--text-sec);
  }

  .grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));
    gap:18px;
  }

  /* 卡片：深暖米底、无边框无阴影，靠底色差出层次 */
  .card {
    position:relative; display:block;
    text-decoration:none; color:inherit;
    background:var(--cream-deep);
    border-radius:var(--radius-lg);
    padding:32px 28px 30px;
    transition:background .18s;
  }
  .card:hover  { background:#DCD5C5; }
  .card:active { background:#D4CBB8; }

  .card .card-mini-icon { margin-bottom:26px; }
  .card .name {
    font-family:var(--serif);
    font-weight:900; font-size:22px;
    line-height:1.4; letter-spacing:-.6px;
  }
  .card .desc {
    margin-top:9px;
    font-size:14px; line-height:1.6;
    color:var(--text-sec);
  }
  .card .tag {
    position:absolute; top:30px; right:28px;
    font-family:var(--mono);
    font-size:10px; letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--orange);
  }

  .empty {
    background:var(--cream-deep);
    border-radius:var(--radius-lg);
    padding:60px 32px; text-align:center;
    color:var(--text-sec); font-size:15px; line-height:1.8;
  }
  .empty code {
    font-family:var(--mono); font-size:13px;
    color:var(--orange);
  }

  footer {
    margin-top:56px; padding-top:22px;
    border-top:1px solid var(--line-soft);
    font-family:var(--mono);
    font-size:11px; letter-spacing:1.2px;
    color:var(--text-sec);
  }

  @media (max-width:480px) {
    .wrap { padding-left:22px; padding-right:22px; }
    header { margin-bottom:40px; }
    header .title-display { font-size:36px; letter-spacing:-1px; }
    .grid { grid-template-columns:1fr; gap:14px; }
    .card { padding:26px 24px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="head-top">
      <div class="icon-tile">⊞</div>
      <div class="head-meta">
        <div class="overline">Workbench</div>
        <div class="head-date" id="date"></div>
      </div>
    </div>
    <h1 class="title-display" id="greet"></h1>
  </header>

  <main>
    <div class="section-head">
      <div class="overline sec">Tools</div>
      <div class="section-count" id="count"></div>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <footer>数据只存在这台设备</footer>

</div>

<script src="tools.js"></script>
<script>
  const now = new Date();

  // 大标题：问候语 + 一句话，关键词换橙色（整页只此一处彩色文字）
  const h = now.getHours();
  const greet =
    h < 6  ? '夜深了' :
    h < 11 ? '早上好' :
    h < 14 ? '中午好' :
    h < 18 ? '下午好' : '晚上好';
  document.getElementById('greet').innerHTML =
    `${greet}，<br>今天想做点<span class="orange">什么</span>`;

  const week = ['周日','周一','周二','周三','周四','周五','周六'][now.getDay()];
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('date').textContent =
    `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} ${week}`;

  // 按 tools.js 的清单渲染卡片
  const grid = document.getElementById('grid');
  const list = window.TOOLS || [];

  document.getElementById('count').textContent =
    list.length ? String(list.length).padStart(2, '0') : '';

  if (!list.length) {
    grid.outerHTML =
      '<div class="empty">还没有工具<br>在 <code>tools.js</code> 里加一条就会出现在这里</div>';
  } else {
    list.forEach(t => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = t.path;
      a.innerHTML = `
        ${t.tag ? `<span class="tag">${t.tag}</span>` : ''}
        <div class="card-mini-icon">${t.icon || '◇'}</div>
        <div class="name"></div>
        <div class="desc"></div>`;
      // 用 textContent 赋值，避免清单里的文字被当 HTML 解析
      a.querySelector('.name').textContent = t.name;
      a.querySelector('.desc').textContent = t.desc || '';
      grid.appendChild(a);
    });
  }

  // 注册离线缓存，失败也不影响正常使用
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
