<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>随手记</title>
<meta name="theme-color" content="#EFEAE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">

<link rel="stylesheet" href="../../theme.css">
<style>
  header { margin-bottom:38px; }
  .head-top { display:flex; align-items:center; gap:14px; margin-bottom:24px; }
  .head-top .overline { color:var(--text-sec); }

  .composer { display:flex; gap:10px; }
  .composer .field { flex:1; }
  .composer .btn { padding:0 22px; white-space:nowrap; }

  .hint {
    margin:12px 0 34px;
    font-family:var(--mono);
    font-size:11px; letter-spacing:.8px;
    color:var(--text-sec);
  }

  /* 列表：靠分隔线区隔，不用卡片，保持编辑感 */
  ul { list-style:none; }
  li {
    display:flex; align-items:flex-start; gap:16px;
    padding:18px 2px;
    border-bottom:1px solid var(--line-soft);
  }
  li:first-child { border-top:1px solid var(--line-soft); }
  li.done .text { color:var(--text-sec); text-decoration:line-through; }

  .check {
    flex-shrink:0; width:22px; height:22px; margin-top:2px;
    background:var(--cream-deep);
    border-radius:6px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:13px; color:transparent;
    transition:background .15s;
  }
  .check:hover { background:#DCD5C5; }
  li.done .check { background:var(--orange); color:#fff; }

  .text {
    flex:1; font-size:17px; line-height:1.55;
    word-break:break-word;
  }

  .del {
    flex-shrink:0; background:none; border:none; cursor:pointer;
    font-family:var(--mono); font-size:16px;
    color:var(--text-sec); opacity:.5;
    padding:0 2px; line-height:1.5;
    transition:opacity .15s, color .15s;
  }
  .del:hover { opacity:1; color:var(--orange); }

  .empty {
    background:var(--cream-deep);
    border-radius:var(--radius-lg);
    padding:56px 30px; text-align:center;
    color:var(--text-sec); font-size:15px; line-height:1.8;
  }

  .bar {
    display:flex; justify-content:space-between; align-items:center;
    margin-top:26px;
    font-family:var(--mono); font-size:11px; letter-spacing:1.2px;
    color:var(--text-sec);
  }
  .bar button {
    background:none; border:none; cursor:pointer;
    font-family:var(--mono); font-size:11px; letter-spacing:1.2px;
    color:var(--text-sec);
    transition:color .15s;
  }
  .bar button:hover { color:var(--orange); }

  @media (max-width:480px) {
    .wrap { padding-left:22px; padding-right:22px; }
    .title-display { font-size:34px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="head-top">
      <a class="back" href="../../" aria-label="返回工作台">←</a>
      <div class="overline">Notes</div>
    </div>
    <h1 class="title-display">随手<span class="orange">记</span></h1>
  </header>

  <form class="composer" id="form">
    <input type="text" class="field" id="input" placeholder="想到什么，记一笔" autocomplete="off">
    <button class="btn" type="submit">记下</button>
  </form>
  <div class="hint">只存在这台设备的浏览器里，不会上传</div>

  <ul id="list"></ul>
  <div class="empty" id="empty">还没有内容<br>在上面记第一笔</div>

  <div class="bar">
    <span id="count"></span>
    <button id="clear" type="button">清除已完成</button>
  </div>

</div>

<script>
  const KEY = 'workbench.notes.v1';
  const listEl  = document.getElementById('list');
  const emptyEl = document.getElementById('empty');
  const countEl = document.getElementById('count');
  const input   = document.getElementById('input');

  // localStorage 可能被隐私模式禁用或存了坏数据，读的时候兜一下
  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || '[]');
      return Array.isArray(raw) ? raw : [];
    } catch { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); }
    catch { alert('保存失败，可能是浏览器隐私模式或存储已满'); }
  }

  let items = load();

  function render() {
    listEl.innerHTML = '';
    emptyEl.style.display = items.length ? 'none' : 'block';

    items.forEach((it, i) => {
      const li = document.createElement('li');
      if (it.done) li.className = 'done';

      const check = document.createElement('div');
      check.className = 'check';
      check.textContent = '✓';
      check.onclick = () => { items[i].done = !items[i].done; save(); render(); };

      const text = document.createElement('div');
      text.className = 'text';
      text.textContent = it.text;   // 不用 innerHTML，避免输入内容被当标签解析

      const del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.textContent = '×';
      del.onclick = () => { items.splice(i, 1); save(); render(); };

      li.append(check, text, del);
      listEl.appendChild(li);
    });

    const left = items.filter(i => !i.done).length;
    const pad = n => String(n).padStart(2, '0');
    countEl.textContent = items.length ? `${pad(left)} 待办 / ${pad(items.length)} 共计` : '';
  }

  document.getElementById('form').onsubmit = e => {
    e.preventDefault();
    const v = input.value.trim();
    if (!v) return;
    items.unshift({ text: v, done: false, at: Date.now() });
    input.value = '';
    save(); render();
  };

  document.getElementById('clear').onclick = () => {
    items = items.filter(i => !i.done);
    save(); render();
  };

  render();
</script>
</body>
</html>
